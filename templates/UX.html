<!DOCTYPE html>
<html lang="en">
  <head>
      <title>Document Analyzer</title>
      <script type="text/javascript" src="{{ url_for('static',filename='boxes.js') }}"></script>
      <link rel="stylesheet" href="../static/resizeStyle.css">
      <link rel="stylesheet" href="../static/toolStyle.css">
  </head>
  <body>
    <div id = 'tool_parent'> <!--this is the parent div that holds all buttons, sliders, etc-->
         
        <div class="inputWrapper">
          <input type="file" class = "buttons" name="file" id="fileInput" required>
        </div>
        <button type="button" class = "buttons" id="uploadButton"onclick="uploadImage()">Upload File</button>
        <div class="slidecontainer" id="verticalSlide">
          <p>Vertical Threshold</p>
          <input type="range" min="1" max="300" value="150" class="slider" id="sliderVert">
          <p>Value: <span id="valueVertical"></span></p>
        </div>
        <div class="slidecontainer" id="horizontalSlide">
          <p>Horizontal Threshold</p>
          <input type="range" min="1" max="300" value="150" class="slider" id="sliderHorizontal">
          <p>Value: <span id="valueHorizontal"></span></p>
        </div>
        <button type="button" id="CreateBoxButton" class="buttons" onclick="createResizeHTML()">Create Box</button>
        <button type="button" id="DeleteBoxButton" class="buttons" onclick="deleteResizeHTML()">Delete Box</button>
        <button id="saveButton" class = "buttons" onclick="saveJson()">Save Changes</button>
        <h1 id="statusText">Awaiting Scan</h1>
    </div> 
    <div class="container"> <!--this is the parent div of all divs regarding the image and content boxes-->
        <div id="image_holder" > 
        <img  id="doc_image">
        </div>
    </div> 
    
    <script type="text/javascript" src="{{ url_for('static',filename='tools.js') }}"></script>
  </body>
</html>
