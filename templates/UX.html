<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document Analyzer</title>
    <script type="text/javascript" src="{{ url_for('static',filename='boxes.js') }}"></script>
    <link rel="stylesheet" href="../static/resizeStyle.css">
    <link rel="stylesheet" href="../static/toolStyle.css">
</head>
<body onload="makeResizableDiv('.resizable')">
  <div id = 'tool_parent'> <!--this is the parent div that holds all buttons, sliders, etc-->
    <div class="slidecontainer" id="verticalSlide">
      <p>Vertical Threshold</p>
      <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
      <p>Value: <span id="demo"></span></p>
    </div>
    <div class="slidecontainer" id="horizontalSlide">
      <p>Horizontal Threshold</p>
      <input type="range" min="1" max="100" value="50" class="slider" id="myRangeHorizontal">
      <p>Value: <span id="demoHorizontal"></span></p>
    </div>
    <button type="button" id="CreateBoxButton" class="buttons">Create Box</button>
    <button type="button" id="DeleteBoxButton" class="buttons">Delete Box</button>
  </div>  
  <div class="container"> <!--this is the parent div of all divs regarding the image and content boxes-->
      <div id="image_holder" > 
      <img src="{{ url_for('static',filename='CleanDocumentFirstPage.png') }}"  id="doc_image">
        <div class='resizable'>
            <div class='resizers'>
              <div class='resizer top-left'></div>
              <div class='resizer top-right'></div>
              <div class='resizer bottom-left'></div>
              <div class='resizer bottom-right'></div>
            </div>
        </div>
        <div class='resizable resizable2'>
          <div class='resizers'>
            <div class='resizer top-left'></div>
            <div class='resizer top-right'></div>
            <div class='resizer bottom-left'></div>
            <div class='resizer bottom-right'></div>
          </div>
      </div>
      </div> 
        
    </div>
  <script type="text/javascript" src="{{ url_for('static',filename='tools.js') }}"></script>
</body>
</html>
